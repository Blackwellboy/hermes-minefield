name: hermes-minefield
version: 0.1.0
description: >-
  Model Serving Minefield integration for Hermes: Lite check, full Doctor,
  flight recorder, /minefield wtf incident analysis, and review-gated
  contribution/issue workflows. Opt-in. Never auto-uploads.
author: Blackwellboy
hooks:
  - pre_tool_call
  - post_tool_call
  - pre_llm_call
  - post_llm_call
  - pre_api_request
  - post_api_request
  - api_request_error
  - on_session_start
  - on_session_end
  - on_session_finalize
