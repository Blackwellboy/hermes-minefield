name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out hermes-minefield
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Check out Model Serving Minefield
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: Blackwellboy/model-serving-minefield
          ref: main
          path: _deps/model-serving-minefield
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./_deps/model-serving-minefield
          python -m pip install pytest PyYAML
          python -m pip install -e . --no-deps

      - name: Assert Minefield integration version
        run: |
          python -c 'from importlib.metadata import version; v=version("model-serving-minefield"); print(v); assert v.startswith("0.2."), v'
          python -c 'from minefield.api import match_symptom; assert callable(match_symptom)'

      - name: Compile
        run: python -m compileall -q hermes_minefield tests

      - name: Test
        run: pytest -q

  hermes-admission:
    runs-on: ubuntu-latest
    steps:
      - name: Check out hermes-minefield
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Validate against pinned current Hermes
        uses: NousResearch/hermes-agent/.github/actions/plugin-validate@99a161531cc7b6ce8d91869666ea19cee0610156
        with:
          path: .
          hermes-ref: 99a161531cc7b6ce8d91869666ea19cee0610156
